

<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Final Speech</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #FFFFF0;
            color: #5e4e3e;
        }

        /* NAVIGATION */

        nav {
            padding: 20px;
            background: #675B58;
            text-align: center;
            border-bottom: 1px solid #e5e5e5;
        }

        nav a {
            margin: 8px;
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
        }

        nav a:hover {
            color: #FFF0F5;
        }

        /* MAIN */

        .container {
            max-width: 850px;
            min-height: 80vh;
            margin: auto;
            padding: 100px 25px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .speech {
            background: white;
            padding: 60px 50px;
            border-radius: 25px;

            text-align: center;

            border: 2px solid #675B58;

            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
        }

        .speech h1 {
            margin-top: 0;
            font-size: 45px;
            color: #ADD8E6;
        }

        .speech .quote {
            font-size: 26px;
            font-weight: bold;
            margin: 30px 0;
        }

        .speech p {
            color: #666;
            line-height: 2;
        }

        .ending {
            margin-top: 35px;
            font-size: 18px;
            color: #778899;
        }

        /* PAGE BUTTONS */

        .page-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 40px;
        }

        .page-buttons a {
            padding: 12px 25px;
            background: #675B58;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            transition: 0.3s;
        }

        .page-buttons a:hover {
            background: #ADD8E6;
            color: #5e4e3e;
        }

        @media (max-width: 600px) {

            .speech {
                padding: 40px 25px;
            }

            .speech h1 {
                font-size: 36px;
            }

            .speech .quote {
                font-size: 21px;
            }

            .page-buttons {
                flex-direction: column;
                align-items: center;
            }

            .page-buttons a {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>


<body>


<!-- NAVIGATION -->

<nav>

    <a href="about.html">About</a>

    <a href="performance.html">Performance</a>

    <a href="speech.html">Final Speech</a>

</nav>



<!-- FINAL SPEECH -->

<div class="container">

    <div class="speech">

        <h1>Final Speech</h1>

        <div class="quote">
            “Our actions shape our results”
        </div>

        <p>
            ทุกผลลัพธ์ล้วนเกิดจากการกระทำ
            และทุกก้าวที่เราเลือกเดิน
            ล้วนพาเราไปสู่ตัวตนที่เราอยากเป็น
        </p>

        <div class="ending">
            Thank you for being part of my story. ♡
        </div>

        <div class="page-buttons">
            <a href="performance.html">← Back</a>
            <a href="index.html">Home →</a>
        </div>

    </div>

</div>


</body>

</html>
